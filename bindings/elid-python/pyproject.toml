[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
compatibility = "manylinux2014"
bindings = "pyo3"
python-source = "python"

[project]
name = "elid"
version = "0.1.0"
description = "ELID: Embedding Locality IDentifier - Compact, sortable identifiers for high-dimensional embeddings"
readme = "README.md"
authors = [
  { name="Zach Handley", email="zachhandley@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
keywords = ["embeddings", "locality", "vector-database", "simhash", "nearest-neighbor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26",
]

[project.urls]
homepage = "https://github.com/zachhandley/ELID"
repository = "https://github.com/zachhandley/ELID"
documentation = "https://github.com/zachhandley/ELID#readme"

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-benchmark>=4.0",
]
