[package]
name = "elid-node"
version = "0.1.0"
edition = "2021"
authors = ["Zach Handley <zachhandley@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Node.js bindings for ELID (Embedding Locality-preserving Identifiers)"
repository = "https://github.com/zachhandley/ELID"
rust-version = "1.77"

[lib]
crate-type = ["cdylib"]

[dependencies]
elid-core = { path = "../../elid-core", version = "0.1.0" }
napi = { version = "2.16", features = ["tokio_rt", "async", "napi8"] }
napi-derive = "2.16"
tokio = { version = "1.35", features = ["rt", "rt-multi-thread"] }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
