[package]
name = "elid-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Zach Handley <zachhandley@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "WASM bindings for ELID (Embedding Locality-preserving Identifiers)"
repository = "https://github.com/zachhandley/ELID"
rust-version = "1.70"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
elid-core = { path = "../../elid-core", version = "0.1.0" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
strip = true
