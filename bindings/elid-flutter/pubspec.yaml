name: elid
description: Flutter bindings for ELID (Embedding Locality-preserving IDentifiers)
version: 0.1.0
homepage: https://github.com/zachhandley/ELID
repository: https://github.com/zachhandley/ELID

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_rust_bridge: ^2.11.0
  freezed_annotation: ^2.4.0
  meta: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  ffigen: ^13.0.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
