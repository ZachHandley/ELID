name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0 or v1.0.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version
        id: stamp
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            # Auto-increment: find latest v* tag and bump patch
            LATEST=$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -z "$LATEST" ]; then
              VERSION="0.1.0"
            else
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            echo "Auto-incremented version: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stamping version: $VERSION"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          components: clippy

      - name: Run tests
        run: cargo test --features ffi,wasm

      - name: Build release
        run: cargo build --release

      - name: Build FFI
        run: cargo build --release --features ffi,embeddings

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/Public/actions/setup-node@main
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Build all WASM targets
        run: pnpm run build:all

      - name: Build ELID-embedtext WASM variants
        run: |
          pnpm exec wasm-pack build --target bundler --out-dir pkg-embedtext -- --features "wasm,models-text"
          pnpm exec wasm-pack build --target nodejs --out-dir pkg-embedtext-node -- --features "wasm,models-text"
          pnpm exec wasm-pack build --target web --out-dir pkg-embedtext-web -- --features "wasm,models-text"

      - name: Build ELID-embedimage WASM variants
        run: |
          pnpm exec wasm-pack build --target bundler --out-dir pkg-embedimage -- --features "wasm,models-image"
          pnpm exec wasm-pack build --target nodejs --out-dir pkg-embedimage-node -- --features "wasm,models-image"
          pnpm exec wasm-pack build --target web --out-dir pkg-embedimage-web -- --features "wasm,models-image"

      - name: Build ELID-both WASM variants (text + image)
        run: |
          pnpm exec wasm-pack build --target bundler --out-dir pkg-both -- --features "wasm,models-text,models-image"
          pnpm exec wasm-pack build --target nodejs --out-dir pkg-both-node -- --features "wasm,models-text,models-image"
          pnpm exec wasm-pack build --target web --out-dir pkg-both-web -- --features "wasm,models-text,models-image"

      - name: Package WASM artifacts
        run: |
          mkdir -p dist
          tar -czf dist/elid-wasm-nodejs.tar.gz -C pkg-node .
          tar -czf dist/elid-wasm-bundler.tar.gz -C pkg .
          tar -czf dist/elid-wasm-web.tar.gz -C pkg-web .

          # Package embedtext variants (if built)
          [ -d pkg-embedtext ] && tar -czf dist/elid-embedtext-bundler.tar.gz -C pkg-embedtext . || true
          [ -d pkg-embedtext-node ] && tar -czf dist/elid-embedtext-nodejs.tar.gz -C pkg-embedtext-node . || true
          [ -d pkg-embedtext-web ] && tar -czf dist/elid-embedtext-web.tar.gz -C pkg-embedtext-web . || true

          # Package embedimage variants (if built)
          [ -d pkg-embedimage ] && tar -czf dist/elid-embedimage-bundler.tar.gz -C pkg-embedimage . || true
          [ -d pkg-embedimage-node ] && tar -czf dist/elid-embedimage-nodejs.tar.gz -C pkg-embedimage-node . || true
          [ -d pkg-embedimage-web ] && tar -czf dist/elid-embedimage-web.tar.gz -C pkg-embedimage-web . || true

          # Package both variants (if built)
          [ -d pkg-both ] && tar -czf dist/elid-both-bundler.tar.gz -C pkg-both . || true
          [ -d pkg-both-node ] && tar -czf dist/elid-both-nodejs.tar.gz -C pkg-both-node . || true
          [ -d pkg-both-web ] && tar -czf dist/elid-both-web.tar.gz -C pkg-both-web . || true

      - name: Upload WASM artifacts
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: wasm-packages
          path: dist/*.tar.gz
          retention-days: 7

  build-python:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main

      - name: Setup Python
        uses: https://forge.blackleafdigital.com/Public/actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Build base wheel (elid)
        run: uv run maturin build --release --features python --out dist

      - name: Build elid-text wheel
        run: |
          # Modify pyproject.toml for elid-text
          cp pyproject.toml pyproject.toml.bak
          sed -i 's/^name = "elid"/name = "elid-text"/' pyproject.toml
          sed -i 's/description = ".*"/description = "ELID with text embedding models (Model2Vec)"/' pyproject.toml
          uv run maturin build --release --features "python,models-text" --out dist
          mv pyproject.toml.bak pyproject.toml

      - name: Build elid-image wheel
        run: |
          cp pyproject.toml pyproject.toml.bak
          sed -i 's/^name = "elid"/name = "elid-image"/' pyproject.toml
          sed -i 's/description = ".*"/description = "ELID with image embedding models (MobileNetV3)"/' pyproject.toml
          uv run maturin build --release --features "python,models-image" --out dist
          mv pyproject.toml.bak pyproject.toml

      - name: Build elid-all wheel
        run: |
          cp pyproject.toml pyproject.toml.bak
          sed -i 's/^name = "elid"/name = "elid-all"/' pyproject.toml
          sed -i 's/description = ".*"/description = "ELID with text and image embedding models"/' pyproject.toml
          uv run maturin build --release --features "python,models-text,models-image" --out dist
          mv pyproject.toml.bak pyproject.toml

      - name: Upload Python wheels
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: python-wheels
          path: dist/*.whl
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-test, build-wasm, build-python]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: wasm-packages
          path: artifacts/wasm

      - name: Download Python wheel
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: python-wheels
          path: artifacts/python

      - name: Create Forgejo release
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          TAG="v${VERSION}"
          BODY="## ELID ${TAG}

          **Embedding Locality IDentifier** - Vector search without vector stores, plus fast string similarity.

          ### Installation
          - **Rust**: \`cargo add elid\`
          - **Python**: \`pip install elid\`
          - **WASM/JS**: \`npm install @elid/core\`

          ### Embedding Encoding (NEW)
          - Lossless, compressed, or max-length encoding
          - Cross-dimensional comparison (compare 256d vs 768d vectors)
          - Mini128, Morton, Hilbert curve profiles

          ### String Similarity
          - Levenshtein, Jaro-Winkler, Hamming, OSA
          - SimHash for near-duplicate detection
          - Best match finder
          "

          # Create tag if this was a workflow_dispatch (no tag exists yet)
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            git config user.name "Forgejo CI"
            git config user.email "ci@forge.blackleafdigital.com"
            git tag -a "$TAG" -m "Release ELID $VERSION"
            git push origin "$TAG" || true
          fi

          # Create release via Forgejo API
          curl -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" --arg name "ELID $TAG" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"

  sync-github:
    name: Sync to GitHub
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Prepare GitHub Actions workflows
        # Generates .github/workflows/ from the .forgejo sources: swaps the
        # org composite actions for upstream ones, injects pnpm/uv setup,
        # strips sccache inputs, and drops the Forgejo-only dispatch jobs.
        # A plain sed pass can't inject the extra setup steps GitHub needs.
        run: python3 ci/sync-github-workflows.py

      - name: Update README for GitHub
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          TAG="v${VERSION}"
          sed -i "s|elid = \"[0-9]*\.[0-9]*\.[0-9]*\"|elid = \"${VERSION}\"|g" README.md
          sed -i 's|https://forge.blackleafdigital.com/BlackLeafDigital/ELID|https://github.com/zachhandley/elid|g' README.md
          sed -i "s|forge.blackleafdigital.com/BlackLeafDigital/ELID/actions/workflows/ci.yml/badge.svg|github.com/zachhandley/elid/actions/workflows/ci.yml/badge.svg|g" README.md
          sed -i "s|forge.blackleafdigital.com/BlackLeafDigital/ELID/actions|github.com/zachhandley/elid/actions|g" README.md

      - name: Commit and push to GitHub
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "Zach Handley"
          git config user.email "zachhandley@gmail.com"
          git add -A
          git commit -m "Release ${TAG} with GitHub Actions workflows"
          # The tag is created in the separate create-release job on another
          # runner, so it does not exist in this checkout. Create it here on the
          # mirror commit (which carries the generated .github/workflows) so the
          # push has a ref to send. -f covers the tag-triggered case too.
          git tag -f "${TAG}"
          git remote add github https://x-access-token:${{ secrets.GH_ACCESS_TOKEN }}@github.com/zachhandley/elid.git
          git push github "refs/tags/${TAG}" --force
          git push github "HEAD:refs/heads/releases" --force

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-test, build-wasm]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json pyproject.toml README.md
          sed -i "s/0\.0\.0-dev/${VERSION}/g" src/ffi.rs

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/Public/actions/setup-node@main
        with:
          node-version: '22'

      - name: Build and publish WASM
        run: |
          pnpm install
          pnpm run build
          cd pkg
          sed -i 's/"name": "elid"/"name": "@elid\/core"/' package.json
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --no-git-checks --access public

  publish-npm-embedtext:
    name: Publish elid-embedtext to npm
    runs-on: ubuntu-latest
    needs: [build-test, build-wasm]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/Public/actions/setup-node@main
        with:
          node-version: '22'

      - name: Build and publish @elid/text
        run: |
          pnpm install
          pnpm exec wasm-pack build --target bundler --out-dir pkg-embedtext -- --features "wasm,models-text"
          cd pkg-embedtext
          sed -i 's/"name": "elid"/"name": "@elid\/text"/' package.json
          sed -i 's/"description": ".*"/"description": "ELID with text embedding models (Model2Vec potion-base-8M)"/' package.json
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --no-git-checks --access public

  publish-npm-embedimage:
    name: Publish elid-embedimage to npm
    runs-on: ubuntu-latest
    needs: [build-test, build-wasm]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/Public/actions/setup-node@main
        with:
          node-version: '22'

      - name: Build and publish @elid/image
        run: |
          pnpm install
          pnpm exec wasm-pack build --target bundler --out-dir pkg-embedimage -- --features "wasm,models-image"
          cd pkg-embedimage
          sed -i 's/"name": "elid"/"name": "@elid\/image"/' package.json
          sed -i 's/"description": ".*"/"description": "ELID with image embedding models (MobileNetV3-Small)"/' package.json
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --no-git-checks --access public

  publish-npm-both:
    name: Publish elid-both to npm
    runs-on: ubuntu-latest
    needs: [build-test, build-wasm]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          sed -i "s/0\.0\.0-dev/${VERSION}/g" Cargo.toml package.json

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/Public/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/Public/actions/setup-node@main
        with:
          node-version: '22'

      - name: Build and publish @elid/both
        run: |
          pnpm install
          pnpm exec wasm-pack build --target bundler --out-dir pkg-both -- --features "wasm,models-text,models-image"
          cd pkg-both
          sed -i 's/"name": "elid"/"name": "@elid\/both"/' package.json
          sed -i 's/"description": ".*"/"description": "ELID with text and image embedding models (Model2Vec + MobileNetV3)"/' package.json
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --no-git-checks --access public

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-test, build-python]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: https://forge.blackleafdigital.com/Public/actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Download Python wheel
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: python-wheels
          path: dist

      - name: Publish to PyPI
        run: uvx twine upload dist/*.whl -u __token__ -p ${{ secrets.PYPI_TOKEN }}
