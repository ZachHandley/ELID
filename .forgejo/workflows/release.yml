name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          components: clippy

      - name: Run tests
        run: cargo test --features ffi,wasm

      - name: Build release
        run: cargo build --release

      - name: Build FFI
        run: cargo build --release --features ffi

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-node@main
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build all WASM targets
        run: npm run build:all

      - name: Package WASM artifacts
        run: |
          mkdir -p dist
          tar -czf dist/elid-wasm-nodejs.tar.gz -C pkg-node .
          tar -czf dist/elid-wasm-bundler.tar.gz -C pkg .
          tar -czf dist/elid-wasm-web.tar.gz -C pkg-web .

      - name: Upload WASM artifacts
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: wasm-packages
          path: dist/*.tar.gz
          retention-days: 7

  build-python:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Setup Python
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Build wheel
        run: uv run maturin build --release --features python --out dist

      - name: Upload Python wheel
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-wasm, build-python]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: wasm-packages
          path: artifacts/wasm

      - name: Download Python wheel
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: python-wheel
          path: artifacts/python

      - name: Create Forgejo release
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY="## ELID ${TAG}

          Fast string similarity library with multi-language support.

          ### Packages
          - **Rust**: \`cargo add elid\`
          - **WASM**: Download artifacts below
          - **Python**: Download wheel below

          ### Algorithms
          - Levenshtein distance
          - Jaro-Winkler similarity
          - Hamming distance
          - OSA distance (with transpositions)
          - SimHash (locality-sensitive hashing)
          - Best match (multi-algorithm)
          "

          # Create release via Forgejo API
          curl -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" --arg name "ELID $TAG" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"

  sync-github:
    name: Sync to GitHub
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Push tag and releases branch to GitHub
        run: |
          git remote add github https://x-access-token:${{ secrets.GH_ACCESS_TOKEN }}@github.com/zachhandley/elid.git
          TAG="${GITHUB_REF_NAME}"
          git push github "refs/tags/${TAG}"
          git push github "HEAD:refs/heads/releases" --force

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-wasm]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-node@main
        with:
          node-version: '22'

      - name: Build and publish WASM
        run: |
          npm install
          npm run build
          cd pkg
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          npm publish
        continue-on-error: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-python]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Download Python wheel
        uses: https://github.com/christopherhx/gitea-download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Publish to PyPI
        run: uvx twine upload dist/*.whl -u __token__ -p ${{ secrets.PYPI_TOKEN }}
        continue-on-error: true
