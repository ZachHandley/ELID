name: Documentation

on:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustdoc:
    name: Build Rust Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Build docs
        run: cargo doc --all-features --no-deps

      - name: Create redirect index
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=elid/index.html"></head></html>' > target/doc/index.html

      - name: Upload documentation
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc/
          retention-days: 30

  c-header:
    name: Verify C Header Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Build with FFI
        run: cargo build --release --features ffi

      - name: Verify header
        run: |
          [ -f elid.h ] || { echo "elid.h not generated"; exit 1; }
          echo "elid.h generated: $(stat -c%s elid.h) bytes"

  demo-site:
    name: Build Demo Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-node@main
        with:
          node-version: '22'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM for demo site
        run: wasm-pack build --target web --out-dir site/public/wasm -- --features wasm

      - name: Build demo site
        run: |
          cd site
          npm install
          npm run build

      - name: Upload demo site
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: demo-site
          path: site/dist/
          retention-days: 30
