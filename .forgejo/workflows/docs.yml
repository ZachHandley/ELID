name: Documentation

on:
  push:
    tags:
      - 'docs-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Demo site version (e.g., 0.1.0). Auto-increments if empty.'
        required: false
        type: string

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustdoc:
    name: Build Rust Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Build docs
        run: cargo doc --features ffi,wasm --no-deps

      - name: Create redirect index
        run: |
          DOC_DIR="${CARGO_TARGET_DIR:-./target}/doc"
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=elid/index.html"></head></html>' > "$DOC_DIR/index.html"

      - name: Upload documentation
        run: |
          DOC_DIR="${CARGO_TARGET_DIR:-./target}/doc"
          echo "DOC_DIR=$DOC_DIR" >> $GITHUB_ENV
        # Can't use env vars in 'with', so copy to a known location
      - name: Stage docs for upload
        run: cp -r "${CARGO_TARGET_DIR:-./target}/doc" ./docs-output

      - name: Upload documentation artifact
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: rust-docs
          path: docs-output/
          retention-days: 30

  c-header:
    name: Verify C Header Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Build with FFI
        run: cargo build --release --features ffi

      - name: Verify header
        run: |
          [ -f elid.h ] || { echo "elid.h not generated"; exit 1; }
          echo "elid.h generated: $(stat -c%s elid.h) bytes"

  demo-site:
    name: Build & Deploy Demo Site
    runs-on: ubuntu-latest
    needs: [rustdoc]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-node@main
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM for demo site
        run: pnpm exec wasm-pack build --target web --out-dir site/public/wasm -- --features wasm

      - name: Build demo site
        run: |
          cd site
          pnpm install
          pnpm run build

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            # Strip leading 'v' if present
            VERSION="${INPUT_VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Using provided version: $VERSION"
          else
            # Auto-increment: find latest demo-release-v* branch
            LATEST=$(git branch -r --list 'origin/demo-release-v*' | \
              sed 's|.*demo-release-v||' | \
              sort -t. -k1,1n -k2,2n -k3,3n | \
              tail -1)

            if [ -z "$LATEST" ]; then
              VERSION="0.0.1"
            else
              MAJOR=$(echo "$LATEST" | cut -d. -f1)
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Auto-incremented version: $VERSION"
          fi

      - name: Create docker-compose.yml
        run: |
          cat > site/dist/docker-compose.yml << 'DEOF'
          services:
            demo:
              image: nginx:alpine
              ports:
                - "8080:80"
              volumes:
                - ./:/usr/share/nginx/html:ro
              restart: unless-stopped
          DEOF

      - name: Deploy to branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="demo-release-v${VERSION}"

          cd site/dist

          git init
          git checkout --orphan "$BRANCH"
          git add -A
          git -c user.name="Zach Handley" -c user.email="zachhandley@gmail.com" \
            commit -m "Demo site v${VERSION}"

          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git push -f "https://x-access-token:${{ secrets.FORGEJO_ACTIONS_TOKEN }}@$(echo '${{ github.server_url }}' | sed 's|https://||')/${{ github.repository }}.git" "$BRANCH"

          echo "Deployed demo site to branch: $BRANCH"

      - name: Build demo site for GitHub Pages
        run: |
          cd site
          rm -rf dist
          ASTRO_SITE=https://zachhandley.github.io ASTRO_BASE=/ELID pnpm run build
          touch dist/.nojekyll

      - name: Push dist to GitHub docs branch
        run: |
          cd site/dist
          git init
          git checkout --orphan docs
          git add -A
          git -c user.name="Zach Handley" -c user.email="zachhandley@gmail.com" \
            commit -m "Docs site ${GITHUB_REF_NAME:-manual}"
          git remote add github https://x-access-token:${{ secrets.GH_ACCESS_TOKEN }}@github.com/zachhandley/elid.git
          git push github docs --force
