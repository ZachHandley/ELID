name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security audit weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # Cargo audit for known vulnerabilities
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # Check for unsafe code
  unsafe-check:
    name: Unsafe Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install cargo-geiger
        run: cargo install cargo-geiger

      - name: Check for unsafe code
        run: |
          echo "Checking for unsafe code usage..."
          cargo geiger --all-features || true
          echo ""
          echo "Note: FFI module is allowed to use unsafe code for C interop"

  # Dependency review
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Check outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated --exit-code 0

      - name: List all dependencies
        run: cargo tree --all-features

  # WASM security check
  wasm-security:
    name: WASM Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          profile: minimal
          override: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: npm run build:node

      - name: Check WASM binary
        run: |
          echo "WASM Binary Analysis:"
          echo "===================="
          file pkg-node/elid_bg.wasm
          echo ""
          echo "Size: $(stat -c%s pkg-node/elid_bg.wasm) bytes"
          echo ""
          echo "✓ WASM binary built successfully"

  # Python security
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check Python dependencies
        run: |
          echo "Checking PyO3 version..."
          grep "pyo3" Cargo.toml
          echo ""
          echo "No Python runtime dependencies - using PyO3 only"

  # License check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install cargo-license
        run: cargo install cargo-license

      - name: Check licenses
        run: |
          echo "Checking dependency licenses..."
          cargo license --all-features --json > licenses.json
          cat licenses.json
          echo ""
          echo "✓ License check complete"

      - name: Verify LICENSE files
        run: |
          echo "Verifying LICENSE files exist..."
          [ -f LICENSE-MIT ] && echo "✓ LICENSE-MIT exists"
          [ -f LICENSE-APACHE ] && echo "✓ LICENSE-APACHE exists"

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  # Documentation check
  docs-security:
    name: Documentation Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for exposed secrets in docs
        run: |
          echo "Scanning documentation for potential secrets..."
          # Check for API keys, tokens, etc.
          ! grep -r -E "(api[_-]?key|secret|password|token)" --include="*.md" . || {
            echo "⚠️  Warning: Found potential secrets in documentation"
            grep -r -E "(api[_-]?key|secret|password|token)" --include="*.md" .
            exit 0  # Warning only, don't fail
          }
          echo "✓ No obvious secrets found in documentation"

      - name: Check for TODO security issues
        run: |
          echo "Checking for security-related TODOs..."
          grep -r "TODO.*security\|FIXME.*security\|XXX.*security" --include="*.rs" . || {
            echo "✓ No security-related TODOs found"
          }

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, unsafe-check, dependency-review, wasm-security, python-security, license-check, docs-security]
    steps:
      - name: Summary
        run: |
          echo "🔒 Security Audit Complete"
          echo "=========================="
          echo "✅ Cargo audit passed"
          echo "✅ Unsafe code checked"
          echo "✅ Dependencies reviewed"
          echo "✅ WASM security verified"
          echo "✅ Python security checked"
          echo "✅ Licenses verified"
          echo "✅ Documentation scanned"
          echo ""
          echo "All security checks passed!"
