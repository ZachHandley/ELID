name: Security

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main

      - name: Cargo Audit
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/cargo-audit@main

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: https://forge.blackleafdigital.com/BlackLeafDigital/actions/setup-rust@main
        with:
          components: clippy

      - name: Clippy all features
        run: cargo clippy --all-features -- -D warnings

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LICENSE files
        run: |
          [ -f LICENSE-MIT ] && echo "LICENSE-MIT exists"
          [ -f LICENSE-APACHE ] && echo "LICENSE-APACHE exists"

      - name: Check dependency tree
        run: |
          cargo install cargo-license
          cargo license --all-features
