name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Rust Core Tests
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run core tests
        run: cargo test --lib

      - name: Run all tests
        run: cargo test --all-features

  # C FFI Tests
  c-ffi-test:
    name: C FFI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: Build C library
        run: cargo build --release --features ffi

      - name: Run FFI unit tests
        run: cargo test --features ffi ffi::

      - name: Compile C test
        run: gcc test-c-ffi.c -I. -L./target/release -lelid -o test-c-ffi

      - name: Run C test
        run: LD_LIBRARY_PATH=./target/release ./test-c-ffi

  # WASM Tests
  wasm-test:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          profile: minimal
          override: true

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Build WASM (Node.js target)
        run: npm run build:node

      - name: Build WASM (Bundler target)
        run: npm run build

      - name: Build WASM (Web target)
        run: npm run build:web

      - name: Run WASM tests
        run: npm run test:all

      - name: Verify WASM file sizes
        run: |
          echo "Checking WASM file sizes..."
          ls -lh pkg-node/elid_bg.wasm
          ls -lh pkg/elid_bg.wasm
          ls -lh pkg-web/elid_bg.wasm
          # Ensure files are at least 90KB (not stub files)
          [ $(stat -c%s pkg-node/elid_bg.wasm) -gt 90000 ] || exit 1
          [ $(stat -c%s pkg/elid_bg.wasm) -gt 90000 ] || exit 1
          [ $(stat -c%s pkg-web/elid_bg.wasm) -gt 90000 ] || exit 1

  # Python Tests
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin

      - name: Build Python wheel
        run: maturin build --release --features python

      - name: Install wheel
        run: pip install target/wheels/elid-*.whl

      - name: Run Python tests
        run: python3 test-python.py

      - name: Run live demo
        run: python3 live-demo.py

  # Formatting and Linting
  fmt-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          profile: minimal
          override: true

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  # Documentation Build
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build docs
        run: cargo doc --all-features --no-deps

      - name: Verify C header generation
        run: |
          cargo build --release --features ffi
          [ -f elid.h ] || exit 1
          echo "✓ C header generated successfully"

  # Summary Job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-test, c-ffi-test, wasm-test, python-test, fmt-clippy, docs]
    steps:
      - name: Success
        run: |
          echo "🎉 All CI checks passed!"
          echo "✅ Rust tests"
          echo "✅ C FFI tests"
          echo "✅ WASM tests"
          echo "✅ Python tests"
          echo "✅ Format & Clippy"
          echo "✅ Documentation"
