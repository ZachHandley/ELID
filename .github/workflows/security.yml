name: Security

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --features ffi,wasm -- -D warnings

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify LICENSE files
        run: |
          [ -f LICENSE-MIT ] && echo "LICENSE-MIT exists"
          [ -f LICENSE-APACHE ] && echo "LICENSE-APACHE exists"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check dependency tree
        run: |
          cargo install cargo-license
          cargo license --features ffi,wasm
