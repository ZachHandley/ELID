name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          sccache: true
          sccache-s3-bucket: ${{ secrets.S3_BUCKET }}
          sccache-s3-endpoint: https://${{ secrets.S3_ENDPOINT }}
          sccache-s3-region: ${{ secrets.S3_REGION }}
          sccache-s3-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
          sccache-s3-secret-access-key: ${{ secrets.S3_ACCESS_SECRET }}
          sccache-key-prefix: sccache/elid

      - name: Run benchmarks
        run: cargo bench --bench similarity_bench

  wasm-size:
    name: WASM Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          sccache: true
          sccache-s3-bucket: ${{ secrets.S3_BUCKET }}
          sccache-s3-endpoint: https://${{ secrets.S3_ENDPOINT }}
          sccache-s3-region: ${{ secrets.S3_REGION }}
          sccache-s3-access-key-id: ${{ secrets.S3_ACCESS_KEY }}
          sccache-s3-secret-access-key: ${{ secrets.S3_ACCESS_SECRET }}
          sccache-key-prefix: sccache/elid

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM
        run: pnpm run build:node

      - name: Check WASM size
        run: |
          size=$(stat -c%s pkg-node/elid_bg.wasm)
          size_kb=$((size / 1024))
          echo "WASM size: ${size_kb} KB"

          max_size_kb=300
          if [ $size_kb -gt $max_size_kb ]; then
            echo "FAILED: WASM is ${size_kb}KB > ${max_size_kb}KB"
            exit 1
          fi
          echo "PASSED: WASM is ${size_kb}KB <= ${max_size_kb}KB"

      - name: Build native library
        run: cargo build --release

      - name: Report native size
        run: |
          size=$(stat -c%s ${CARGO_TARGET_DIR:-./target}/release/libelid.so)
          size_kb=$((size / 1024))
          echo "Native library size: ${size_kb} KB"
