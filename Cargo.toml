[workspace]
resolver = "2"
members = [
    "elid-core",
    "elid-cli",
    "bindings/elid-ffi",
    "bindings/test-vector-gen",
    "bindings/elid-node",
    "bindings/elid-flutter/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zach Handley <zachhandley@gmail.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
