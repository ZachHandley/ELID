[package]
name = "elid"
version = "0.4.51"
edition = "2021"
authors = ["Zach Handley <zachhandley@gmail.com>"]
description = "Embedding Locality IDentifier - encode embeddings into sortable string IDs for vector search without vector stores, plus fast string similarity algorithms"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZachHandley/ELID"
keywords = ["embeddings", "vector-search", "similarity", "levenshtein", "fuzzy-search"]
categories = ["algorithms", "text-processing", "encoding", "science"]

[lib]
name = "elid"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["strings", "embeddings"]
strings = []                  # Zero-dependency string similarity
embeddings = [                # Vector encoding (now included by default)
  "dep:rand", "dep:rand_chacha", "dep:rand_distr",
  "dep:blake3", "dep:data-encoding", "dep:once_cell",
  "dep:thiserror", "dep:serde", "dep:half"
]
models = []                   # Base model support (error types, path resolution)
models-text = ["models", "dep:safetensors", "dep:tokenizers", "dep:serde_json"]  # Text embedding (Model2Vec via safetensors)
models-image = ["models", "dep:tract-onnx", "dep:image"]  # Image embedding (MobileNetV3 via ONNX)
models-fetch = ["models", "dep:ureq"]  # Native HTTP model fetching (Python/FFI)
wasm = ["strings", "embeddings", "dep:wasm-bindgen", "dep:js-sys", "dep:serde", "dep:serde-wasm-bindgen", "dep:serde_json", "dep:wasm-bindgen-futures", "dep:gloo-net"]
python = ["strings", "embeddings", "dep:pyo3", "dep:numpy", "dep:rayon"]
ffi = ["strings", "embeddings"]

[dependencies]
# No external dependencies for core algorithms - pure Rust implementation
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
rand_distr = { version = "0.4", optional = true }
blake3 = { version = "1.5", optional = true }
data-encoding = { version = "2.5", optional = true }
once_cell = { version = "1.19", optional = true }
thiserror = { version = "1.0", optional = true }
half = { version = "2.4", optional = true }
rayon = { version = "1.8", optional = true }
numpy = { version = "0.27", optional = true }
tract-onnx = { version = "0.21", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
safetensors = { version = "0.7", optional = true, default-features = false, features = ["std"] }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }
ureq = { version = "3", optional = true }
gloo-net = { version = "0.6", optional = true, features = ["http"] }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dependencies.pyo3]
version = "0.27"
features = ["extension-module"]
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# The optional `rand 0.8` chain (enabled by the `embeddings` feature, which is
# in the default set) pulls `rand_core 0.6` → `getrandom 0.2`, whose wasm32
# build errors unless its `js` feature is activated. Declaring it here under
# the wasm32 target — unconditionally, not gated on the `wasm` feature —
# means any downstream consumer (Blazen, ai_brain, ztrader, ...) that builds
# ELID for wasm32 gets the `js` flag flipped via Cargo's additive feature
# unification, without needing to manually re-pin getrandom 0.2 in their own
# Cargo.toml. Mirrors the existing `getrandom03` line above.
getrandom02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }

[dev-dependencies]
criterion = "0.5"
wasm-bindgen-test = "0.3"

[build-dependencies]
cbindgen = "0.26"

[[bench]]
name = "similarity_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
