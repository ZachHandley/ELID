[package]
name = "elid"
version = "0.0.0-dev"
edition = "2021"
authors = ["Zach Handley <zachhandley@gmail.com>"]
description = "Embedding Locality IDentifier - encode embeddings into sortable string IDs for vector search without vector stores, plus fast string similarity algorithms"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZachHandley/ELID"
keywords = ["embeddings", "vector-search", "similarity", "levenshtein", "locality-sensitive-hashing"]
categories = ["algorithms", "text-processing", "encoding", "science"]

[lib]
name = "elid"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["strings", "embeddings"]
strings = []                  # Zero-dependency string similarity
embeddings = [                # Vector encoding (now included by default)
  "dep:rand", "dep:rand_chacha", "dep:rand_distr",
  "dep:blake3", "dep:data-encoding", "dep:once_cell",
  "dep:thiserror", "dep:serde", "dep:half"
]
wasm = ["strings", "embeddings", "dep:wasm-bindgen", "dep:js-sys", "dep:serde", "dep:serde-wasm-bindgen", "dep:serde_json", "dep:getrandom"]
python = ["strings", "embeddings", "dep:pyo3", "dep:numpy", "dep:rayon"]
ffi = ["strings", "embeddings"]

[dependencies]
# No external dependencies for core algorithms - pure Rust implementation
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
rand_distr = { version = "0.4", optional = true }
blake3 = { version = "1.5", optional = true }
data-encoding = { version = "2.5", optional = true }
once_cell = { version = "1.19", optional = true }
thiserror = { version = "1.0", optional = true }
half = { version = "2.4", optional = true }
rayon = { version = "1.8", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
numpy = { version = "0.27", optional = true }

[dependencies.pyo3]
version = "0.27"
features = ["extension-module"]
optional = true

[dev-dependencies]
criterion = "0.5"
wasm-bindgen-test = "0.3"

[build-dependencies]
cbindgen = "0.26"

[[bench]]
name = "similarity_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
